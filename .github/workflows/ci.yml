name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint package.json
        uses: bvandrc/lint-package-json@v2

      - name: Lint & Type Check
        run: pnpm check

  readme:
    name: README.md is current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build README
        run: pnpm build

      - name: Compare with the committed README
        run: |
          if ! git diff --exit-code README.md; then
            echo "::error file=README.md::README.md is out of date with src/. Run \`pnpm build\` and commit the result."
            exit 1
          fi
