name: Generate README

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays, 05:00 UTC
  pull_request:
  workflow_dispatch:

concurrency:
  group: generate-readme-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # skip PRs from forks — the token can't push to them
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - run: pnpm build:readme

      - name: Commit regenerated README
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate README.md"
            git push
          else
            echo "README.md is up to date"
          fi
